# Cloudflare Workers config for the dashboard portal.
#
# The site is served from the repository root (same as Netlify's
# `publish = "."`). Two Cloudflare-native pieces replace what Netlify used to
# do around it:
#
#   * `.assetsignore` — repo files (tools/, README, the configs themselves) are
#     never uploaded, so they 404 by not existing. Netlify could only hide them
#     with `force = true` 404 rules, and Cloudflare's `_redirects` has no 404
#     status; excluding the files is the stronger form of the same guarantee.
#   * `worker.js` — answers the one live endpoint. Netlify routed
#     `/api/watchlist` to a function; here the Worker owns the path (see
#     `run_worker_first` below), and the counting rules moved into the Worker
#     with it.
#
# `run_worker_first` is scoped to /api/* only, so static asset requests never
# pay for a Worker invocation.
#
#   npx wrangler dev      → local test on http://localhost:8787
#   npx wrangler deploy   → publish to <name>.<your-subdomain>.workers.dev

name = "dashboards-home"
main = "worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

# The Content Tracker row's live figures. The portal cannot read that
# dashboard itself (its endpoint sends no CORS headers), so worker.js reads it
# server-side. Netlify carried this as WATCHLIST_URL in the site's environment
# settings; here it is a plain (non-secret) variable next to the code that
# uses it. Update it if the dashboard ever moves again.
[vars]
# The Pages mirror of that dashboard, not its Workers hostname: a Worker cannot
# fetch another Worker's workers.dev hostname — Cloudflare answers 1042, the loop
# guard — while a pages.dev hostname is fetched without complaint. Naming the
# mirror is therefore what makes this URL work as the no-binding fallback rather
# than only as a source of a path. Both hosts serve the endpoint; this is the one
# that answers everywhere the code runs.
WATCHLIST_URL = "https://contenttrackerdashboard.pages.dev/.netlify/functions/watchlist"

# ...but the reading itself goes over a service binding, not that URL.
# A binding resolves the target Worker directly, in the same account, with no
# public hop for the 84 KB payload to make.
#
# The path still comes from WATCHLIST_URL above, so there is one place that says
# where the endpoint lives; the URL stays as the fallback for a local
# `wrangler dev`, where the binding's target may not be running.
[[services]]
binding = "WATCHLIST"
service = "content-tracker-dashboard"
