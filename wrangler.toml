# The one config this site has: its Cloudflare Pages project.
#
#   npx wrangler pages deploy          → publish .pages-dist to the project
#   npx wrangler pages dev .           → local test on http://localhost:8788
#
# There is no Worker config and no Worker. `wrangler pages deploy` run from this
# directory takes the project name, its vars and its bindings from here, and
# `pages_build_output_dir` names the upload that tools/deploy-pages.mjs stages
# from this repository. The function half of the site is a Pages Function -
# `functions/[[path]].js`, which hands every request to `functions/_router.js` -
# and Pages compiles those files as part of the deploy, so nothing is bundled
# here and `wrangler deploy` is not a command this repository has any use for.

name = "dashboards-home-portal"
pages_build_output_dir = ".pages-dist"
compatibility_date = "2026-10-01"

# Shared feedback KV. Create the `site-feedback` namespace first, then set its
# returned ID here (and bind SITE_FEEDBACK in the Pages dashboard for the
# production project). Do not invent an ID: Wrangler credentials are currently
# expired, so this binding is documented but intentionally not enabled.
# [[kv_namespaces]]
# binding = "SITE_FEEDBACK"
# id = "<site-feedback namespace ID>"

[vars]
# Where the Content Tracker's live figures are read from, server-side, by the
# function.
#
# This was a `[[services]]` binding to the Content Tracker's Worker, because a
# service binding cannot target a Pages project. That Worker is gone, so the
# binding is gone with it and the read is an ordinary fetch of the Content
# Tracker's own Pages endpoint. It has to be server-side: that dashboard sends
# no Access-Control-Allow-Origin and answers OPTIONS with 405, so a browser on
# this origin can only fail.
WATCHLIST_URL = "https://contenttrackerdashboard.pages.dev/.netlify/functions/watchlist"
