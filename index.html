<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard Portal</title>
    <meta
      name="description"
      content="One page for every deployed dashboard: media analytics, visa decisions, RBI data and UCD timetables."
    />
    <meta name="theme-color" content="#101216" />
    <meta name="color-scheme" content="dark light" />

    <!-- Runs before first paint so the stored theme applies without a flash. -->
    <script src="theme-init.js"></script>

    <!-- Both faces are first-paint critical: Geist sets the wordmark and every
         row title, Inter sets everything else. -->
    <link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/geist-sans.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Two vendored libraries, both MIT, both zero-build:
           modern-normalize  cross-browser baseline
           Open Props        the scale tokens styles.css consumes
         Order matters: normalize, then tokens, then this project's rules. -->
    <link rel="stylesheet" href="vendor/modern-normalize.css" />
    <link rel="stylesheet" href="vendor/open-props.min.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <a class="skip-link" href="#dashboards">Skip to dashboards</a>

    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">DP</div>
          <h1 class="brand-name">Dashboard Portal</h1>
        </div>

        <!-- Filtering lives in the bar so it costs no vertical space. Below
             700px it wraps to a second line instead of being hidden. -->
        <div class="field">
          <label class="sr-only" for="filter">Filter dashboards</label>
          <span class="field-ico" data-icon="search" aria-hidden="true"></span>
          <input
            id="filter"
            class="field-input"
            type="search"
            placeholder="Filter dashboards"
            autocomplete="off"
            spellcheck="false"
          />
          <kbd class="field-hint" aria-hidden="true">/</kbd>
        </div>

        <button
          id="recheck"
          class="icon-btn"
          type="button"
          title="Re-check every link"
          aria-label="Re-check every link"
        >
          <span data-icon="refresh-cw" aria-hidden="true"></span>
        </button>

        <button
          id="theme-toggle"
          class="icon-btn"
          type="button"
          title="Switch to light mode"
          aria-label="Switch to light mode"
          aria-pressed="false"
        >
          <span class="theme-glyph theme-glyph-sun" aria-hidden="true"></span>
          <span class="theme-glyph theme-glyph-moon" aria-hidden="true"></span>
        </button>
      </div>
    </header>

    <main class="shell">
      <!-- The list is built in the browser from data/dashboards.js. Without
           scripting there would otherwise be a blank page and no explanation. -->
      <noscript>
        <p class="empty">
          <span class="empty-title">This portal builds its list in the browser</span>
          <span class="empty-body"
            >With JavaScript disabled there is nothing to show. The repository and the
            portfolio are linked in the footer.</span
          >
        </p>
      </noscript>

      <!-- One band: counts or health on the left, filter on the right. -->
      <div class="ledger-head">
        <p id="meta" class="meta" aria-live="polite"></p>

        <div class="chips" role="group" aria-label="Filter by availability">
          <button class="chip is-on" type="button" data-scope="all" aria-pressed="true">
            All
          </button>
          <button class="chip" type="button" data-scope="live" aria-pressed="false">
            Reachable
          </button>
          <button class="chip" type="button" data-scope="pending" aria-pressed="false">
            Awaiting deploy
          </button>
        </div>
      </div>

      <!-- tabindex="-1" on the skip link's target so a keyboard user actually
           lands here; the heading alone is not focusable. -->
      <section id="dashboards" tabindex="-1" aria-labelledby="dashboards-heading">
        <h2 id="dashboards-heading" class="sr-only">Dashboards</h2>

        <ul id="grid" class="registry">
          <!-- Rows are rendered from data/dashboards.js -->
        </ul>

        <p id="empty" class="empty" hidden>
          <span class="empty-ico" data-icon="search" aria-hidden="true"></span>
          <span id="empty-title" class="empty-title">Nothing matches that filter</span>
          <span id="empty-body" class="empty-body">Try a different word, or reset the filter to see every dashboard.</span>
          <button id="empty-reset" class="btn" type="button">Reset filter</button>
        </p>
      </section>

      <p id="footnote" class="footnote" hidden>
        <span data-icon="triangle-alert" aria-hidden="true"></span>
        <span id="footnote-text"></span>
      </p>
    </main>

    <footer class="footer">
      <p class="footer-inner">
        <span>Built for personal use</span>
        <a href="https://parth-portfolio-wb.netlify.app/" rel="noopener">Portfolio</a>
        <a href="https://github.com/parth-soni-10/dashboard-portal" rel="noopener">Source</a>
      </p>
    </footer>

    <script src="data/dashboards.js"></script>
    <script src="icons.js"></script>
    <script src="app.js" defer></script>
  </body>
</html>
