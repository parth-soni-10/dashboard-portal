<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard Portal</title>
    <meta
      name="description"
      content="One page for every deployed dashboard: media analytics, visa decisions, expenses, RBI data and UCD timetables."
    />
    <meta name="theme-color" content="#0e1114" />
    <meta name="color-scheme" content="dark light" />

    <!-- Runs before first paint so the stored theme applies without a flash. -->
    <script src="theme-init.js"></script>

    <link
      rel="preload"
      href="fonts/geist-sans.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Open Props (MIT): the scale tokens (space, radii, shadows, type sizes,
         easings) that styles.css consumes. Keep it before styles.css. -->
    <link rel="stylesheet" href="vendor/open-props.min.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <a class="skip-link" href="#dashboards">Skip to dashboards</a>

    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">DP</div>
          <div class="brand-text">
            <h1>Dashboard Portal</h1>
          </div>
        </div>

        <div class="topbar-spacer"></div>

        <button
          id="recheck"
          class="icon-btn"
          type="button"
          title="Re-check every link"
          aria-label="Re-check every link"
        >
          <span data-icon="refresh-cw" aria-hidden="true"></span>
        </button>

        <button
          id="theme-toggle"
          class="icon-btn"
          type="button"
          title="Switch to light mode"
          aria-label="Switch to light mode"
          aria-pressed="false"
        >
          <span class="theme-glyph theme-glyph-sun" aria-hidden="true"></span>
          <span class="theme-glyph theme-glyph-moon" aria-hidden="true"></span>
        </button>
      </div>
    </header>

    <main class="shell">
      <section class="toolbar" aria-label="Filter dashboards">
        <div class="field">
          <label class="sr-only" for="filter">Filter dashboards</label>
          <span class="field-ico" data-icon="search" aria-hidden="true"></span>
          <input
            id="filter"
            class="field-input"
            type="search"
            placeholder="Filter dashboards"
            autocomplete="off"
            spellcheck="false"
          />
          <kbd class="field-hint" aria-hidden="true">/</kbd>
        </div>

        <div class="chips" role="group" aria-label="Filter by availability">
          <button class="chip is-on" type="button" data-scope="all">All</button>
          <button class="chip" type="button" data-scope="live">Reachable</button>
          <button class="chip" type="button" data-scope="pending">Awaiting deploy</button>
        </div>
      </section>

      <p id="meta" class="meta" aria-live="polite"></p>

      <section aria-labelledby="dashboards">
        <h2 id="dashboards" class="sr-only">Dashboards</h2>

        <ul id="grid" class="grid">
          <!-- Cards are rendered from data/dashboards.js -->
        </ul>

        <p id="empty" class="empty" hidden>
          <span class="empty-ico" data-icon="search" aria-hidden="true"></span>
          <span id="empty-title" class="empty-title">Nothing matches that filter</span>
          <span id="empty-body" class="empty-body">Try a different word, or reset the filter to see every dashboard.</span>
          <button id="empty-reset" class="btn" type="button">Reset filter</button>
        </p>
      </section>

      <p id="footnote" class="footnote" hidden>
        <span data-icon="triangle-alert" aria-hidden="true"></span>
        <span id="footnote-text"></span>
      </p>
    </main>

    <footer class="footer">
      <p class="footer-inner">
        <span>Built for personal use</span>
        <a href="https://parth-portfolio-wb.netlify.app/" rel="noopener">Portfolio</a>
        <a href="https://github.com/parth-soni-10/dashboard-portal" rel="noopener">Source</a>
      </p>
    </footer>

    <script src="data/dashboards.js"></script>
    <script src="icons.js"></script>
    <script src="app.js" defer></script>
  </body>
</html>
