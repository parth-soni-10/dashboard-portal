# Control config for this site's Cloudflare Pages project — the one host it
# has.
#
# `wrangler pages deploy` run from this directory takes the project name, its
# bindings and its vars from here, and `pages_build_output_dir` names the upload
# that tools/deploy-pages.mjs stages.

name = "dashboards-home-portal"
pages_build_output_dir = "../.pages-dist"
compatibility_date = "2026-10-01"

[vars]
# Where the Content Tracker's figures are read from, server-side, by worker.js.
#
# This used to be a service binding to the Content Tracker's Worker, with this
# URL as the fallback. The binding is gone because that Worker is gone: every
# project is served from Pages alone now, so there is nothing to bind to. What
# is left is the public endpoint, read from the function — the read has to be
# server-side because the dashboard's own endpoint sends no
# Access-Control-Allow-Origin and answers OPTIONS with 405, so a browser on this
# origin can only fail.
WATCHLIST_URL = "https://contenttrackerdashboard.pages.dev/.netlify/functions/watchlist"
