# Control config for this repository's Pages mirror.
#
# It lives in the repository now so CI can deploy the mirror the way the local
# deploy script did: `wrangler pages deploy` run from this directory takes the
# project name, its bindings and its vars from here, and `pages_build_output_dir`
# names the upload that tools/deploy-pages.mjs stages.

name = "dashboards-home-portal"
pages_build_output_dir = "../.pages-dist"
compatibility_date = "2026-10-01"

# The portal asks the Content Tracker Worker for watchlist counts through this
# binding, so the count is one source whether the portal is opened here or on its
# Workers deployment.
[[services]]
binding = "WATCHLIST"
service = "content-tracker-dashboard"

[vars]
# The mirror's read goes over the binding above; this URL supplies the path it is
# read from and is the fallback when the binding is absent. It names the Content
# Tracker's Pages mirror because a Worker cannot fetch another Worker's
# workers.dev hostname (Cloudflare answers 1042), and because both hosts serve
# the endpoint. Keep it in step with the Workers config's copy.
WATCHLIST_URL = "https://contenttrackerdashboard.pages.dev/.netlify/functions/watchlist"
