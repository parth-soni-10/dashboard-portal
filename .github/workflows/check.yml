name: Check

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # No build step, no package.json: the repo root IS the publish directory,
      # so "does it still parse" is the whole of a static check.
      # tools/audit.mjs is zero-dependency and exits non-zero on a finding, so it
      # is the whole regression suite: dead selectors, unused tokens, missing
      # icon glyphs, unbalanced markup, manifest fields nothing renders, CSP
      # shape, and that no file in the repo is published by accident.
      - name: Static hygiene audit
        run: node tools/audit.mjs

      # The netlify/functions/ directory is gone with the function it held: the
      # Pages Function owns /api/watchlist now. Its files are checked here too,
      # because Pages compiles them at deploy time and a syntax error in one is
      # a failed deploy rather than a failing test. tools/audit.mjs covers the
      # rest.
      - name: Syntax-check the site, the function and the tools
        run: |
          set -e
          for f in app.js icons.js theme-init.js functions/*.js tools/*.mjs; do
            node --check "$f"
          done
