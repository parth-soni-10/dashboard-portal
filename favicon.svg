<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The page's own device: an entry's index numeral, in the page's own ink.
       Deliberately not a tinted rounded square with initials, which is the one
       shape every generated project reaches for. The 3px radius is the control
       radius at this scale, and a dark stamp reads on light and dark browser
       chrome alike, so this needs no prefers-color-scheme variant. -->
  <rect width="32" height="32" rx="3" fill="#0e0e11" />
  <text
    x="16"
    y="21.5"
    text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="13"
    font-weight="500"
    fill="#ffffff"
  >01</text>
</svg>
