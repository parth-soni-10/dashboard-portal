# Netlify config - pure static site, no build step.
#
# There is deliberately no `/* -> /index.html` rewrite: the portal is a single
# page with no client-side routing, so a greedy rewrite would only create the
# classic "asset served as index.html with status 200" failure mode.

[build]
  publish = "."

# Explicit Content-Type + no-cache on every asset, matching the other
# dashboards. `charset=utf-8` is pinned defensively: the page is plain ASCII
# today, but a silent Latin-1 fallback would corrupt the first non-ASCII
# character anyone adds to the copy.

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "no-cache, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"
    Cache-Control = "no-cache, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/index.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    Cache-Control = "no-cache, must-revalidate"
    X-Content-Type-Options = "nosniff"

# Fonts are content-addressed by filename and change rarely, so they can be
# cached hard. Everything else stays revalidated.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

# Catch-all: security headers only, no Cache-Control (the rules above own that
# for the paths they cover, and duplicate values would fight).
#
#   * X-Frame-Options + frame-ancestors 'none' - the portal is never iframed.
#   * script-src 'self' - no inline script anywhere in the page, which is also
#     why the theme bootstrap lives in theme-init.js instead of a <script> tag.
#     This blocks Netlify's injected free-plan badge, which is intended.
#   * connect-src allows *.netlify.app because the reachability check pings the
#     deployed dashboards. If a dashboard ever moves to a custom domain, add
#     that origin here or its card will read "Unreachable" for the wrong reason.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://*.netlify.app; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; object-src 'none'"
