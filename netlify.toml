# Netlify config - pure static site, no build step.
#
# Response headers are NOT here. They live in `_headers`, because Netlify only
# reads this file for a repository-connected deploy: a drag-and-drop or
# API/zip deploy ignores netlify.toml completely and would ship the site with
# no CSP. `_headers` works in every deploy mode. Keep it that way.
#
# There is deliberately no `/* -> /index.html` rewrite either: the portal is a
# single page with no client-side routing, so a greedy rewrite would only
# create the classic "asset served as index.html with status 200" failure mode.

[build]
  publish = "."

# The Content Tracker row shows live figures read from that dashboard's own data
# endpoint, which sends no CORS headers — so a browser here cannot read it and
# the reading happens in a function instead. This gives it a short, stable,
# same-origin path. An exact rewrite, not a wildcard: a greedy one is how an
# asset ends up served as index.html with a 200.
[[redirects]]
  from = "/api/watchlist"
  to = "/.netlify/functions/watchlist-count"
  status = 200
